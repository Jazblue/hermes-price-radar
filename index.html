<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Price Radar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hermes Price Radar</h1>
        <div id="last-updated">Last updated: Never</div>
        <div id="stats">
            <div>Tracked products: <span id="product-count">0</span></div>
            <div>Price observations: <span id="history-count">0</span></div>
        </div>
        <div id="products-container">
            <!-- Products will be inserted here by JavaScript -->
        </div>
        <div id="recent-changes">
            <h2>Recent Price Changes</h2>
            <div id="changes-list">No recent changes</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
